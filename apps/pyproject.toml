[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "market-intel-mvp"
version = "0.1.0"
description = "Qualitative Market Intelligence Surveillance MVP - Bursa Malaysia Announcements"
authors = [{name = "HackLab2.0 Team", email = "team@hacklab.local"}]
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    # FastAPI & Web Framework
    "fastapi>=0.104.1",
    "uvicorn[standard]>=0.24.0",
    "python-multipart>=0.0.6",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",

    # Database
    "sqlalchemy>=2.0.23",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.1",

    # Redis (Progress Tracking)
    "redis>=5.0.1",
    "aioredis>=2.0.1",

    # Playwright (Web Scraping - CRITICAL)
    "playwright>=1.40.0",
    "pyppeteer>=1.0.2",

    # PDF Processing
    "pydantic-extra-types>=2.4.1",
    "docling>=0.2.0",
    "pypdf>=4.0.1",
    "pydantic-ai>=0.1.0",
    "tabula-py>=2.5.1",
    "pdfplumber>=0.10.3",
    "PyPDF2>=3.0.0",

    # OCR
    "paddleocr>=2.7.0.3",
    "paddlepaddle>=2.5.1",
    "pdf2image>=1.16.3",

    # LLM & Agents
    "langchain>=0.1.1",
    "langchain-community>=0.0.10",
    "langchain-openai>=0.0.7",
    "langgraph>=0.0.13",
    "langchain-core>=0.1.9",

    # Vector DB
    "pinecone-client>=2.2.4",
    "weaviate-client>=3.26.0",
    "pymilvus>=2.4.0",
    "sentence-transformers>=2.2.2",
    "openai>=1.3.6",

    # NLP & Text Processing
    "nltk>=3.8.1",
    "spacy>=3.7.2",
    "textblob>=0.17.1",

    # Logging
    "loguru>=0.7.2",
    "python-json-logger>=2.0.7",

    # HTTP & Async
    "httpx>=0.25.2",
    "aiohttp>=3.9.1",
    "requests>=2.31.0",

    # Utilities
    "python-dotenv>=1.0.0",
    "click>=8.1.7",
    "pyyaml>=6.0.1",
    "python-dateutil>=2.8.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.3",
    "pytest-asyncio>=0.21.1",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.5.0",
    "pytest-mock>=3.12.0",
    "pytest-httpx>=0.21.0",
    "black>=23.12.0",
    "isort>=5.13.2",
    "flake8>=6.1.0",
    "mypy>=1.7.1",
    "pre-commit>=3.5.0",
    "jupyter>=1.0.0",
    "ipython>=8.18.1",
    "watchfiles>=0.21.0",
    "faker>=20.1.0",
]

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | migrations
)/
'''

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true
multi_line_mode = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = ["venv/", "migrations/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --cov=. --cov-report=html --cov-report=term-missing"

[tool.setuptools]
packages = ["scraping", "etl", "storage", "schemas", "agents", "workflows", "api"]
